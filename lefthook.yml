pre-commit:
  parallel: true
  commands:
    lint:
      run: bun run lint
    typecheck:
      run: bun run typecheck
    secrets:
      run: bun run secrets:check
commit-msg:
  commands:
    commitlint:
      run: bun run --bun commitlint --edit "{1}"
pre-push:
  parallel: true
  commands:
    check:
      run: bun run check
    secrets:
      run: bun run secrets:check --history
    licenses:
      run: bun run license:check
